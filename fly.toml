app = "magnethome"
primary_region = "cdg"

[build]

[env]
  HTTP_ADDR = ":8080"
  DATA_DIR = "/data"
  RAFT_BIND = "127.0.0.1:9000"
  LANDING_DIR = "/app"
  DEFAULT_FROM = "hola@magnethome.es"
  FROM_OPTIONS = "hola@magnethome.es,info@magnethome.es"

[[mounts]]
  source = "magnethome_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/admin/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
